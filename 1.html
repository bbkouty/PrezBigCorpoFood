<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ma présentation Reveal.js</title>
  <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/theme/black.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>Slide 1 : Bienvenue 👋</section>
      <section>Slide 2 : C'est facile ! ✅</section>
      <section>
        <h2>Slide 3</h2>
        <p>On peut même avoir des listes :</p>
        <ul>
          <li>Point 1</li>
          <li>Point 2</li>
        </ul>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
  <script>
    Reveal.initialize();
  </script>
</body>
</html>
